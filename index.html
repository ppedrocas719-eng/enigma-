<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM // ARG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #020807;
            color: #00ffcc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- FASE 1: TERMINAL --- */
        #fase1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            border: 1px dashed #00ffcc;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: rgba(0, 15, 12, 0.95);
            box-shadow: 0 0 15px rgba(0,255,204,0.2);
        }

        input[type="text"] {
            background: #000;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 12px;
            font-family: monospace;
            margin-top: 20px;
            text-align: center;
            width: 90%;
            font-size: 16px;
            outline: none;
        }

        button {
            background: #00ffcc;
            color: #020807;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-family: monospace;
            width: 95%;
            font-size: 16px;
        }

        button:hover {
            background: #00cca3;
        }

        .hint {
            font-size: 18px;
            margin-top: 20px;
            letter-spacing: 4px;
        }

        .secret-watermark {
            color: #1c2d28; 
            font-size: 12px;
            margin-top: 50px;
            user-select: none;
            letter-spacing: 2px;
            background-color: #000;
            padding: 5px 10px;
            border-radius: 4px;
        }

        /* --- FASE 2: DESKTOP RETRÔ --- */
        #fase2 {
            display: none;
            width: 100%;
            min-height: 100vh;
            background-color: #0a6b68;
            padding: 30px 20px;
            position: relative;
            flex-direction: column;
            justify-content: flex-start;
        }

        .desktop-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px 15px;
            max-width: 500px;
            margin: 20px auto 0 auto;
        }

        .folder {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-align: center;
        }

        .folder-icon {
            width: 45px;
            height: 35px;
            background-color: #f5cc00;
            border: 2px solid #000;
            border-radius: 2px 6px 2px 2px;
            position: relative;
            margin-bottom: 6px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.4);
        }

        .folder-icon::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 0;
            width: 18px;
            height: 6px;
            background-color: #f5cc00;
            border: 2px solid #000;
            border-bottom: none;
        }

        .folder-name {
            font-size: 11px;
            color: #ffffff;
            background: rgba(0,0,0,0.4);
            padding: 2px 4px;
            border-radius: 2px;
            word-break: break-word;
            font-family: 'Courier New', Courier, monospace;
        }

        .folder-name.red {
            color: #ff3333;
            font-weight: bold;
        }

        /* JANELAS / MODAIS RETRÔ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        .modal-content {
            background: #c0c0c0;
            border: 3px solid #ffffff;
            border-right-color: #000;
            border-bottom-color: #000;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            color: #000;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.5);
        }

        .modal-header {
            background: #000080;
            color: #fff;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .close-btn {
            background: #c0c0c0;
            color: #000;
            border: 1px solid #000;
            padding: 0 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-body {
            font-size: 13px;
            line-height: 1.4;
            background: #fff;
            padding: 12px;
            border: 2px inset #fff;
            max-height: 300px;
            overflow-y: auto;
            word-break: break-word;
        }

        .modal-body input {
            background: #fff;
            color: #000;
            border: 1px solid #000;
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            font-size: 14px;
            outline: none;
        }

        .modal-body button {
            background: #c0c0c0;
            color: #000;
            border: 2px solid #fff;
            border-right-color: #000;
            border-bottom-color: #000;
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-body button:active {
            border: 2px inset #fff;
        }

        /* BARRA DO DOS NO FUNDO */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #c0c0c0;
            border-top: 2px solid #fff;
            padding: 4px 10px;
            font-size: 10px;
            color: #000;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- ================= FASE 1 ================= -->
    <div id="fase1">
        <div class="container">
            <h2>[ TERMINAL MOBILE ]</h2>
            <p style="margin-top: 10px;">O sinal está corrompido. Apenas uma captura revelará o padrão.</p>
            <p style="margin-top: 5px;">> Status: <span style="color: #ff3333;">BLOQUEADO</span></p>

            <input type="text" id="pass1" placeholder="Insira o vetor...">
            <br>
            <button onclick="validarFase1()">EXECUTAR</button>

            <p id="msg1" style="color: #ff3333; font-size: 12px; margin-top: 15px;"></p>

            <div class="hint">📸☀️🔎</div>

            <div class="secret-watermark">VlvwruUrrsxq</div>
        </div>
    </div>

    <!-- ================= FASE 2 ================= -->
    <div id="fase2">
        <div class="desktop-grid">
            <!-- 3 Arquivos Abertos em Cima -->
            <div class="folder" onclick="abrirArquivo('diario')">
                <div class="folder-icon"></div>
                <div class="folder-name">Diario</div>
            </div>
            <div class="folder" onclick="abrirArquivo('tesouro')">
                <div class="folder-icon"></div>
                <div class="folder-name">Tesouro</div>
            </div>
            <div class="folder" onclick="abrirArquivo('biblioteca')">
                <div class="folder-icon"></div>
                <div class="folder-name">Biblioteca</div>
            </div>

            <!-- Espaço vazio para manter a grade alinhada -->
            <div></div>

            <!-- 2 Arquivos Bloqueados Embaixo -->
            <div class="folder" onclick="abrirArquivo('cofre')">
                <div class="folder-icon"></div>
                <div class="folder-name">🔒 Cofre</div>
            </div>
            <div class="folder" onclick="abrirArquivo('secret')">
                <div class="folder-icon"></div>
                <div class="folder-name red">🔒 ???</div>
            </div>
        </div>

        <div class="bottom-bar">
            <span>PC-486 · 4 MB RAM · DOS 6.22</span>
            <span id="relogio">16:36:07</span>
        </div>
    </div>

    <!-- JANELA / MODAL -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modal-title">Arquivo</span>
                <button class="close-btn" onclick="fecharModal()">X</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Conteúdo Dinâmico -->
            </div>
        </div>
    </div>

    <script>
        // Relógio dinâmico na barra do DOS
        setInterval(() => {
            const d = new Date();
            document.getElementById('relogio').innerText = d.toTimeString().split(' ')[0];
        }, 1000);

        function validarFase1() {
            let inputVal = document.getElementById('pass1').value.trim().toLowerCase();
            if(inputVal === "systemroot") {
                document.getElementById('fase1').style.display = "none";
                document.getElementById('fase2').style.display = "flex";
            } else {
                document.getElementById('msg1').innerText = "ERRO: Vetor inválido. Acesso negado.";
            }
        }

        let cofreDesbloqueado = false;
        let secretDesbloqueado = false;

        function abrirArquivo(id) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');

            modal.style.display = "flex";

            if(id === 'diario') {
                title.innerText = "Diario.txt";
                body.innerHTML = `
                    <p><b>Registro: Terça-feira, chuva forte.</b></p><br>
                    <p>Passei o dia todo arrumando a estante antiga do porão. Achei cadernos velhos com anotações sem sentido, parecem códigos perdidos de um projeto antigo:</p><br>
                    <p><b>RUxFTlVOQ0E=</b></p><br>
                    <p>O tempo não melhora e o sinal de rádio continua chiando lá fora.</p>
                `;
            } 
            else if(id === 'tesouro') {
                title.innerText = "Tesouro.txt";
                body.innerHTML = `
                    <p><b>Notas de Campo / Pesquisa</b></p><br>
                    <p>Anotação rápida sobre sequências numéricas encontradas na parede dos fundos:</p><br>
                    <p><b>VRXEH</b></p><br>
                    <p>E também aquela série estranha de pulsos magnéticos gravados no gravador de fita:</p><br>
                    <p><b>01000100 01001001 01010011 01010011 01001111</b></p>
                `;
            } 
            else if(id === 'biblioteca') {
                title.innerText = "Biblioteca.txt";
                body.innerHTML = `
                    <p><b>Acervo Histórico - Manual de Criptografia</b></p><br>
                    <p>"...as camadas de uma mensagem nunca devem ser lidas isoladamente. O topo esconde a base, o meio revela o fluxo, e a união contínua forma a chave completa do sistema de segurança..."</p><br>
                    <p><i>Lembre-se: remova espaços e junte tudo em uma única palavra contínua para testar nos terminais bloqueados.</i></p>
                `;
            } 
            else if(id === 'cofre') {
                title.innerText = "Cofre.sys";
                if(!cofreDesbloqueado) {
                    body.innerHTML = `
                        <p><b>[ TERMINAL DE ACESSO AO COFRE ]</b></p><br>
                        <p>Insira a palavra-chave combinada:</p>
                        <input type="text" id="passCofre" placeholder="Digite a senha...">
                        <button onclick="checarCofre()">AUTORIZAR</button>
                        <p id="msgCofre" style="color: red; margin-top: 8px; font-size: 11px;"></p>
                    `;
                } else {
                    body.innerHTML = `
                        <p><b>[ COFRE DESBLOQUEADO ]</b></p><br>
                        <p>Sinal de áudio interceptado:</p><br>
                        
                        <!-- Player com o ficheiro de áudio morse -->
                        <audio controls autoplay style="width: 100%; margin-bottom: 10px;">
                            <source src="morse.mp3" type="audio/mp3">
                            Seu navegador não suporta o player de áudio.
                        </audio>

                        <p><b>Bloco Cifrado Auxiliar (Chave: CHAVE):</b></p>
                        <p style="font-family: monospace; background: #eee; padding: 6px; margin-top: 5px;">CVRRFC3R4</p>
                    `;
                }
            } 
                        else if(id === 'secret') {
                title.innerText = "???";
                if(!secretDesbloqueado) {
                    body.innerHTML = `
                        <p><b>[ ARQUIVO OCULTO - RESTRIÇÃO MÁXIMA ]</b></p><br>
                        <p>Insira a chave final extraída do cofre:</p>
                        <input type="text" id="passSecret" placeholder="Senha final...">
                        <button onclick="checarSecret()">DECRYPT</button>
                        <p id="msgSecret" style="color: red; margin-top: 8px; font-size: 11px;"></p>
                    `;
                } else {
                    body.innerHTML = `
                        <p><b>[ TRANSMISSÃO FINAL ]</b></p><br>

                        <!-- Vídeo do chiado CRT em loop -->
                        <video autoplay loop muted playsinline style="width: 100%; border: 2px solid #000;">
                            <source src="chiado.mp4" type="video/mp4">
                            Seu navegador não suporta vídeos.
                        </video>

                        <!-- Áudio em código morse tocando junto com o vídeo -->
                        <audio autoplay loop style="display: none;">
                            <source src="morse.mp3" type="audio/mp3">
                        </audio>
                    `;
                }
            }

        function fecharModal() {
            document.getElementById('modal').style.display = "none";
        }

        function checarCofre() {
            let val = document.getElementById('passCofre').value.trim().toUpperCase();
            if(val === "ELENUNCASOUBEDISSO") {
                cofreDesbloqueado = true;
                abrirArquivo('cofre');
            } else {
                document.getElementById('msgCofre').innerText = "ACESSO NEGADO: Sequência inválida.";
            }
        }

        function checarSecret() {
            let val = document.getElementById('passSecret').value.trim().toUpperCase();
            if(val === "VOCENAOCONHECEAVERDADE") {
                secretDesbloqueado = true;
                abrirArquivo('secret');
            } else {
                document.getElementById('msgSecret').innerText = "ACESSO NEGADO: Chave incorreta.";
            }
        }
    </script>
</body>
</html>
